name: Update data inventory table

# Runs automatically whenever the JSON data changes on the default branch,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data/data_sources.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  knit-table:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("rmarkdown", "knitr", "dplyr", "jsonlite", "here", "kableExtra"))'

      - name: Knit the .Rmd
        run: |
          Rscript -e 'rmarkdown::render("visualizations/dataset_table.Rmd")'

      - name: Commit updated table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visualizations/dataset_table.md
          git diff --staged --quiet || git commit -m "Auto-update data inventory table"
          git push
