name: Update data inventory table

# Runs automatically whenever data.json changes on the default branch,
# and can also be triggered manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "data.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-table:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate table
        run: python generate_table.py

      - name: Commit updated table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_inventory_table.md
          git diff --staged --quiet || git commit -m "Auto-update data inventory table"
          git push
